  <ellipse cx="72" cy="56" rx="9" ry="6" fill="#05142b" stroke="url(#silver)" stroke-width="2.5"/>
  <circle cx="48" cy="56" r="3" fill="#ffcc00"/>
  <circle cx="72" cy="56" r="3" fill="#ffcc00"/>
