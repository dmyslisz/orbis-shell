      <stop offset="100%" stop-color="#0a1f44"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b0c8e8"/>
      <stop offset="100%" stop-color="#6080a8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="12" fill="url(#bg)"/>
